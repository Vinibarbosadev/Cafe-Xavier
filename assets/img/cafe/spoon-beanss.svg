<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-spoon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D1D13"/>
      <stop offset="100%" stop-color="#1A0A06"/>
    </linearGradient>
    <linearGradient id="wood-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C5332"/>
      <stop offset="100%" stop-color="#4A2916"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg-spoon)" rx="16"/>

  <!-- Colher de Madeira de Rústica -->
  <g transform="translate(180, 100) rotate(-25 150 200)">
    <!-- Cabo -->
    <path d="M 130,220 L 40,480 C 35,500 65,510 75,490 L 160,230 Z" fill="url(#wood-grad)"/>
    <!-- Concha da Colher -->
    <ellipse cx="160" cy="180" rx="80" ry="110" fill="url(#wood-grad)"/>
    <ellipse cx="160" cy="180" rx="68" ry="95" fill="#2B1710"/>
    
    <!-- Grãos de Café na Colher -->
    <g fill="#4A2617">
      <ellipse cx="140" cy="150" rx="14" ry="22" transform="rotate(35 140 150)"/>
      <ellipse cx="175" cy="140" rx="15" ry="24" transform="rotate(-15 175 140)"/>
      <ellipse cx="160" cy="180" rx="16" ry="26" transform="rotate(10 160 180)"/>
      <ellipse cx="130" cy="190" rx="15" ry="22" transform="rotate(-40 130 190)"/>
      <ellipse cx="185" cy="195" rx="14" ry="23" transform="rotate(45 185 195)"/>
      <ellipse cx="155" cy="220" rx="16" ry="24" transform="rotate(-10 155 220)"/>
    </g>
    <g stroke="#D7B98A" stroke-width="1.5" fill="none">
      <path d="M 138,138 Q 142,150 138,162"/>
      <path d="M 172,128 Q 177,140 172,152"/>
      <path d="M 158,167 Q 162,180 158,193"/>
    </g>
  </g>

  <!-- Grãos ao redor da colher -->
  <g fill="#2B1710" stroke="#1A0A06" stroke-width="2">
    <ellipse cx="100" cy="420" rx="18" ry="28" transform="rotate(55 100 420)"/>
    <ellipse cx="140" cy="460" rx="16" ry="25" transform="rotate(-25 140 460)"/>
    <ellipse cx="420" cy="150" rx="15" ry="24" transform="rotate(30 420 150)"/>
    <ellipse cx="480" cy="200" rx="17" ry="26" transform="rotate(-40 480 200)"/>
    <ellipse cx="450" cy="480" rx="20" ry="30" transform="rotate(15 450 480)"/>
  </g>
</svg>
