<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="hero-grad" cx="70%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#4A2617"/>
      <stop offset="50%" stop-color="#2B1710"/>
      <stop offset="100%" stop-color="#140905"/>
    </radialGradient>
    <radialGradient id="warm-light" cx="65%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#D7B98A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2B1710" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fundo Terroso Escuro -->
  <rect width="1600" height="900" fill="url(#hero-grad)"/>

  <!-- Brilho de Luz Quente em Destaque -->
  <rect width="1600" height="900" fill="url(#warm-light)"/>

  <!-- Grãos de Café Espalhados (Silhuetas Artísticas) -->
  <g fill="#1F0D07" opacity="0.6">
    <!-- Canto Inferior Direito -->
    <ellipse cx="1400" cy="750" rx="35" ry="55" transform="rotate(35 1400 750)"/>
    <ellipse cx="1480" cy="800" rx="40" ry="60" transform="rotate(-15 1480 800)"/>
    <ellipse cx="1320" cy="820" rx="30" ry="45" transform="rotate(50 1320 820)"/>
    <ellipse cx="1250" cy="700" rx="25" ry="40" transform="rotate(-40 1250 700)"/>

    <!-- Canto Inferior Esquerdo -->
    <ellipse cx="200" cy="850" rx="45" ry="65" transform="rotate(-25 200 850)"/>
    <ellipse cx="100" cy="780" rx="35" ry="50" transform="rotate(40 100 780)"/>
    <ellipse cx="320" cy="880" rx="40" ry="55" transform="rotate(15 320 880)"/>
  </g>
  
  <g fill="#5A2F1B" opacity="0.4">
    <ellipse cx="1430" cy="720" rx="20" ry="32" transform="rotate(15 1430 720)"/>
    <ellipse cx="1350" cy="780" rx="22" ry="36" transform="rotate(-30 1350 780)"/>
  </g>
</svg>
