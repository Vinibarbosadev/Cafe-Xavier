<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Fundo Terroso Escuro -->
  <rect width="400" height="400" fill="#2B1710"/>
  
  <!-- Pacote de Café 1 (Moído) -->
  <rect x="70" y="80" width="110" height="190" rx="8" fill="#F4EBDD" stroke="#D7B98A" stroke-width="2"/>
  <text x="125" y="160" font-family="'Playfair Display', serif" font-weight="900" font-size="14" fill="#5A2F1B" text-anchor="middle">Xavier</text>

  <!-- Pacote de Café 2 (Gourmet) -->
  <rect x="200" y="60" width="120" height="210" rx="8" fill="#4F7A3D" stroke="#D7B98A" stroke-width="2"/>
  <text x="260" y="150" font-family="'Playfair Display', serif" font-weight="900" font-size="15" fill="#FFFDF9" text-anchor="middle">Xavier</text>

  <!-- Xícara de café à frente -->
  <ellipse cx="280" cy="310" rx="55" ry="16" fill="#F4EBDD"/>
  <path d="M 240,265 L 248,300 C 248,310 312,310 312,300 L 320,265 Z" fill="#FFFDF9"/>
  <ellipse cx="280" cy="265" rx="40" ry="10" fill="#22110B"/>
</svg>
