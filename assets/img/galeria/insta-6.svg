<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Fundo Rústico Café Torrado & Moagem -->
  <rect width="400" height="400" fill="#1F110B"/>
  
  <!-- Superfície em Madeira Nobre -->
  <rect y="180" width="400" height="220" fill="#381D12"/>
  <line x1="0" y1="260" x2="400" y2="260" stroke="#2B150C" stroke-width="2"/>
  <line x1="0" y1="330" x2="400" y2="330" stroke="#2B150C" stroke-width="2"/>

  <!-- Filtro / Porta-filtro artesanal de café -->
  <path d="M 130,90 L 270,90 L 225,190 L 175,190 Z" fill="#F4EBDD" stroke="#D7B98A" stroke-width="3"/>
  <ellipse cx="200" cy="90" rx="70" ry="16" fill="#D7B98A"/>
  <ellipse cx="200" cy="90" rx="55" ry="12" fill="#3D1E11"/>

  <!-- Moedor / Detalhes de Café -->
  <!-- Gotas de café caindo na xícara de vidro -->
  <ellipse cx="200" cy="270" rx="45" ry="12" fill="#D7B98A" opacity="0.3"/>
  <path d="M 165,210 L 175,270 C 175,282 225,282 225,270 L 235,210 Z" fill="rgba(255,253,249,0.15)" stroke="#D7B98A" stroke-width="1.5"/>
  <path d="M 172,245 L 175,270 C 175,280 225,280 225,270 L 228,245 Z" fill="#5A2F1B"/>

  <!-- Grãos de Café Espalhados ao Redor -->
  <g fill="#4A2515" stroke="#26120A" stroke-width="1">
    <ellipse cx="90" cy="310" rx="14" ry="9" transform="rotate(-25 90 310)"/>
    <path d="M 83,304 Q 90,310 97,316" stroke="#1F110B" stroke-width="1.5" fill="none"/>
    
    <ellipse cx="120" cy="335" rx="13" ry="8" transform="rotate(35 120 335)"/>
    <path d="M 115,330 Q 120,335 125,340" stroke="#1F110B" stroke-width="1.5" fill="none"/>
    
    <ellipse cx="290" cy="315" rx="15" ry="10" transform="rotate(40 290 315)"/>
    <path d="M 285,310 Q 290,315 295,320" stroke="#1F110B" stroke-width="1.5" fill="none"/>

    <ellipse cx="325" cy="340" rx="12" ry="8" transform="rotate(-15 325 340)"/>
    <path d="M 319,338 Q 325,340 331,342" stroke="#1F110B" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Vapor Sutil -->
  <path d="M 195,195 Q 190,165 200,135" fill="none" stroke="#F4EBDD" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
</svg>
