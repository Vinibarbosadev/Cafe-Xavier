<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="100%" height="100%">
  <defs>
    <linearGradient id="pouch-green-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A5C2D"/>
      <stop offset="50%" stop-color="#4F7A3D"/>
      <stop offset="100%" stop-color="#243B1A"/>
    </linearGradient>
    <filter id="shadow-drop-green" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#15240E" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#shadow-drop-green)">
    <!-- Corpo da Embalagem Pouch -->
    <path d="M 50,40 L 250,40 C 265,40 270,55 265,70 L 250,380 C 248,395 235,405 210,405 L 90,405 C 65,405 52,395 50,380 L 35,70 C 30,55 35,40 50,40 Z" fill="url(#pouch-green-bg)" stroke="#D7B98A" stroke-width="2"/>
    
    <!-- Válvula Aromática -->
    <circle cx="150" cy="95" r="10" fill="#243B1A" stroke="#D7B98A" stroke-width="1.5"/>
    <circle cx="150" cy="95" r="3" fill="#D7B98A"/>

    <!-- Rótulo Central -->
    <g transform="translate(150, 240) scale(0.75)">
      <circle cx="0" cy="0" r="110" fill="#FFFDF9" stroke="#5A2F1B" stroke-width="5" />
      <circle cx="0" cy="0" r="102" fill="none" stroke="#D7B98A" stroke-width="2" stroke-dasharray="4 3" />
      
      <text x="0" y="-55" font-family="'Playfair Display', serif" font-weight="800" font-size="24" fill="#5A2F1B" text-anchor="middle" letter-spacing="3">CAFÉ</text>
      <text x="0" y="-10" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="36" fill="#5A2F1B" text-anchor="middle">Xavier</text>

      <!-- Símbolo de Folha/Origem -->
      <g transform="translate(0, -35) scale(0.8)">
        <path d="M 0,-18 Q 15,-5 0,15 Q -15,-5 0,-18 Z" fill="#4F7A3D"/>
        <path d="M 0,-18 L 0,15" stroke="#D7B98A" stroke-width="1.5"/>
      </g>
      
      <!-- Ramos de Café -->
      <path d="M -70,30 Q -30,65 0,68 C -20,65 -50,55 -70,30 Z" fill="#4F7A3D"/>
      <path d="M 70,30 Q 30,65 0,68 C 20,65 50,55 70,30 Z" fill="#4F7A3D"/>

      <!-- Tarja do tipo -->
      <rect x="-85" y="70" width="170" height="26" rx="13" fill="#4F7A3D"/>
      <text x="0" y="87" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#FFFDF9" text-anchor="middle" letter-spacing="1">CAFÉ GOURMET</text>
    </g>

    <!-- Rodapé da Embalagem -->
    <text x="150" y="375" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#FFFDF9" text-anchor="middle" letter-spacing="1">250g | 100% Arábica Premium</text>
  </g>
</svg>
