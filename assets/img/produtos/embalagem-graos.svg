<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="100%" height="100%">
  <defs>
    <linearGradient id="pouch-dark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D2013"/>
      <stop offset="50%" stop-color="#2B1710"/>
      <stop offset="100%" stop-color="#1A0D0A"/>
    </linearGradient>
    <filter id="shadow-drop-dark" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#shadow-drop-dark)">
    <!-- Corpo da Embalagem Pouch -->
    <path d="M 50,40 L 250,40 C 265,40 270,55 265,70 L 250,380 C 248,395 235,405 210,405 L 90,405 C 65,405 52,395 50,380 L 35,70 C 30,55 35,40 50,40 Z" fill="url(#pouch-dark-bg)" stroke="#5A2F1B" stroke-width="2"/>
    
    <!-- Válvula Aromática -->
    <circle cx="150" cy="95" r="10" fill="#2B1710" stroke="#D7B98A" stroke-width="1.5"/>
    <circle cx="150" cy="95" r="3" fill="#D7B98A"/>

    <!-- Rótulo Central -->
    <g transform="translate(150, 240) scale(0.75)">
      <circle cx="0" cy="0" r="110" fill="#F4EBDD" stroke="#D7B98A" stroke-width="5" />
      <circle cx="0" cy="0" r="102" fill="none" stroke="#5A2F1B" stroke-width="2" stroke-dasharray="4 3" />
      
      <text x="0" y="-55" font-family="'Playfair Display', serif" font-weight="800" font-size="24" fill="#5A2F1B" text-anchor="middle" letter-spacing="3">CAFÉ</text>
      <text x="0" y="-10" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="36" fill="#5A2F1B" text-anchor="middle">Xavier</text>

      <!-- Grãos de café ilustrados -->
      <g transform="translate(0, -35) scale(0.8)">
        <ellipse cx="-8" cy="-5" rx="8" ry="12" fill="#5A2F1B" transform="rotate(-20 -8 -5)"/>
        <path d="M -11,-15 Q -6,-5 -11,5" stroke="#D7B98A" stroke-width="1.5" fill="none" transform="rotate(-20 -8 -5)"/>
        
        <ellipse cx="8" cy="-2" rx="8" ry="12" fill="#3D1E11" transform="rotate(25 8 -2)"/>
        <path d="M 5,-12 Q 10,-2 5,8" stroke="#D7B98A" stroke-width="1.5" fill="none" transform="rotate(25 8 -2)"/>
      </g>
      
      <!-- Ramos de Café -->
      <path d="M -70,30 Q -30,65 0,68 C -20,65 -50,55 -70,30 Z" fill="#4F7A3D"/>
      <path d="M 70,30 Q 30,65 0,68 C 20,65 50,55 70,30 Z" fill="#4F7A3D"/>

      <!-- Tarja do tipo -->
      <rect x="-85" y="70" width="170" height="26" rx="13" fill="#2B1710"/>
      <text x="0" y="87" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#D7B98A" text-anchor="middle" letter-spacing="1">TORRADO EM GRÃOS</text>
    </g>

    <!-- Rodapé da Embalagem -->
    <text x="150" y="375" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#D7B98A" text-anchor="middle" letter-spacing="1">1kg | Espresso Seleção</text>
  </g>
</svg>
